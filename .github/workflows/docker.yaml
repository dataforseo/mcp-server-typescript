name: Publish to Docker Hub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image version
        id: version
        run: |
          TAG_VERSION=${{ github.ref_name }}
          IMAGE_VERSION=${TAG_VERSION#v}
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_ENV"
          if [[ "$IMAGE_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release image: $IMAGE_VERSION (skip :latest)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Stable image: $IMAGE_VERSION (also tag :latest)"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (pre-release)
        if: steps.version.outputs.prerelease == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            dataforseo/mcp:${{ env.IMAGE_VERSION }}
            dataforseo/mcp:beta

      - name: Build and push (stable)
        if: steps.version.outputs.prerelease == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            dataforseo/mcp:${{ env.IMAGE_VERSION }}
            dataforseo/mcp:latest
